<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>找回密码 - 校园论坛</title>
  <link rel="icon" type="image/svg+xml" href="/images/logo.svg">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/login.css">
</head>
<body>
  <div id="notificationArea" class="notification-area"></div>

  <div class="login-container">
    <div class="login-wrapper">
      <!-- 左侧欢迎区域 -->
      <div class="login-welcome">
        <div class="welcome-content">
          <div class="welcome-icon">
            <i class="fas fa-key"></i>
          </div>
          <h1 class="welcome-title">找回密码</h1>
          <p class="welcome-subtitle">
            忘记密码？别担心<br>
            通过邮箱验证码即可重置您的密码
          </p>
          <ul class="features-list">
            <li><i class="fas fa-check-circle"></i> 输入注册时的QQ号与邮箱</li>
            <li><i class="fas fa-check-circle"></i> 验证码将发送至您的邮箱</li>
            <li><i class="fas fa-check-circle"></i> 验证后即可设置新密码</li>
          </ul>
        </div>
      </div>

      <!-- 右侧表单区域 -->
      <div class="login-form-area">
        <div class="form-header">
          <h2 class="form-title">重置密码</h2>
          <p class="form-subtitle">请按以下步骤完成密码重置</p>
        </div>

        <!-- 步骤指示器 -->
        <div class="forgot-steps">
          <div class="forgot-step active" id="step-indicator-1"><span>1</span>验证身份</div>
          <div class="forgot-step-line"></div>
          <div class="forgot-step" id="step-indicator-2"><span>2</span>设置新密码</div>
        </div>

        <!-- 步骤1：验证身份并发送验证码 -->
        <div id="step-send" class="form-section active">
          <div class="form-group">
            <label for="qq-forgot">QQ号</label>
            <input type="text" id="qq-forgot" placeholder="请输入注册时的QQ号" required autocomplete="username">
          </div>
          <div class="form-group">
            <label for="email-forgot">邮箱</label>
            <div class="email-input-group">
              <input type="email" id="email-forgot" placeholder="请输入注册时的邮箱" required autocomplete="email">
              <button type="button" id="send-forgot-code" class="verification-code-button">发送验证码</button>
            </div>
          </div>
          <div class="form-group">
            <label for="captcha-code-forgot">图形验证码</label>
            <div class="captcha-row">
              <input type="text" id="captcha-code-forgot" placeholder="请输入图片中的数字" required maxlength="4" autocomplete="off">
              <div class="captcha-img" id="captcha-img-forgot" title="点击刷新验证码"></div>
            </div>
          </div>
          <button id="confirm-send-code" class="login-button">发送验证码</button>
          <div class="form-footer-links">
            <a href="login.html"><i class="fas fa-arrow-left"></i> 返回登录</a>
          </div>
        </div>

        <!-- 步骤2：设置新密码 -->
        <div id="step-reset" class="form-section">
          <div class="form-group">
            <label for="verification-code-forgot">邮箱验证码</label>
            <input type="text" id="verification-code-forgot" placeholder="请输入邮件中的6位验证码" required maxlength="6" autocomplete="off">
          </div>
          <div class="form-group">
            <label for="new-password-forgot">新密码</label>
            <input type="password" id="new-password-forgot" placeholder="请设置新密码（至少6位）" required autocomplete="new-password">
          </div>
          <div class="form-group">
            <label for="confirm-password-forgot">确认新密码</label>
            <input type="password" id="confirm-password-forgot" placeholder="再次输入新密码" required autocomplete="new-password">
          </div>
          <button id="confirm-reset-password" class="login-button">重置密码</button>
          <div class="form-footer-links">
            <a href="login.html"><i class="fas fa-arrow-left"></i> 返回登录</a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="js/utils.js" defer></script>
  <script src="js/forgot-password.js" defer></script>
</body>
</html>
